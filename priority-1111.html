(function(){

  var byId = {}; DATA.forEach(function(r){ byId[r.id] = r; });
  function defaults(){ var s = {high:[],medium:[],low:[]}; DATA.forEach(function(r){ s[r.priority_default].push(r.id); }); return s; }
  function normalize(saved){
    var s = {high:[],medium:[],low:[]}, seen = {};
    if (saved && saved.p) P.forEach(function(p){ (saved.p[p] || []).forEach(function(id){ if (byId[id] && !seen[id]){ s[p].push(id); seen[id] = 1; } }); });

    var r = byId[id];
    var chips = P.map(function(q){ return '<button type="button" class="chip" data-act="to" data-to="'+q+'" aria-pressed="'+(q===p)+'" aria-label="עדיפות '+FULL[q]+'">'+LBL[q]+'</button>'; }).join('');
    return '<li class="card" draggable="true" data-id="'+r.id+'">' +

      '<div class="name">'+U.esc(r.name)+'</div>' +
      '<div class="task" title="'+U.esc(r.task)+'">'+U.esc(r.task)+'</div>' +
      '<div class="ctl">'+chips+'<span class="arrows"><button type="button" class="arr" data-act="up" aria-label="למעלה"'+(i===0?' disabled':'')+'>&#8593;</button><button type="button" class="arr" data-act="down" aria-label="למטה"'+(i===n-1?' disabled':'')+'>&#8595;</button></span></div>' +
      '</li>';
  }

  function moveTo(id, p, idx){
    var w = where(id); if (!w) return;
    st[w.p].splice(w.i, 1);
    if (idx == null || idx > st[p].length) idx = st[p].length;

  }

    else if (act === 'up' && w.i > 0){ moveTo(id, w.p, w.i - 1); focusArr(id, 'up'); }
    else if (act === 'down' && w.i < st[w.p].length - 1){ moveTo(id, w.p, w.i + 1); focusArr(id, 'down'); }
  });
  function focusArr(id, a){ var el = board.querySelector('.card[data-id="'+id+'"] [data-act="'+a+'"]'); if (el && !el.disabled) el.focus(); else { el = board.querySelector('.card[data-id="'+id+'"] .arr:not(:disabled)'); if (el) el.focus(); } }
  var dragId = null;

  function listAt(e){ var col = e.target.closest('.col'); return col ? col.querySelector('.list') : null; }
