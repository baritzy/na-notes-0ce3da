<style>

--ok:#7ad9a0;--ok-bg:#12301f;--wait:#f1c36b;--wait-bg:#3a2a0b;--doubt:#f09aaa;--doubt-bg:#3d151f;--cancel:#aab3bf;--cancel-bg:#2a2f37;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;overflow-x:hidden}

.hd h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:700;letter-spacing:-.01em}

:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

:root{--maxw:940px}

table{width:100%;border-collapse:collapse;font-size:.95rem}

tbody td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}

footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.printbtn{margin-top:14px}
@media (max-width:640px){

tbody td{border:0;padding:0}
td.n{width:auto;grid-row:1}
td.t{width:auto;grid-row:1}
td.s{width:auto;grid-column:1 / -1;margin-top:2px}

}
@media print{

body{font-size:11pt;background:#fff}
.wrap{max-width:none;padding:0}
.printbtn{display:none}
.total{border:1px solid #888;border-inline-start:6px solid #000}
tr,li{break-inside:avoid}
thead{display:table-header-group}
@page{margin:14mm}
}
</style>

<body>
<div class="wrap">
<header class="hd">
<div class="kicker">New Angle · X2</div>
<h1>X2 · רשימת התיקונים שביקשת <span style="white-space:nowrap">· 11.11.26</span></h1>
<p class="lede">כל השינויים שביקשת בזומים של היום, מסודרים לפי המיקום בסרט.</p>
<div class="total"><div class="big" id="cnt"></div><div><div class="what">תיקונים ושינויים שביקשת היום</div><div class="sub" id="sub"></div></div></div>
<button type="button" class="btn printbtn" onclick="window.print()">הדפסה / PDF</button>
</header>
<section aria-labelledby="h-list">
<h2 id="h-list">הרשימה</h2>
<table><thead><tr><th scope="col">מס׳</th><th scope="col">זמן בסרט</th><th scope="col">שוט</th><th scope="col">מה מתבצע</th></tr></thead><tbody id="tb"></tbody></table>
</section>
<footer>זמנים בסרט לפי הגרסה שעברנו עליה בזומים. "כל הסרט" = שינוי שחל על כל ההופעות לאורך הסרט.</footer>
</div>
<script>
var DATA = {"items": [{"tc": "0:23", "general": false, "name": "חיבור הרחפן לעיט", "task": "הרחפן מתחיל לנוע אלינו לפני המעבר, והתנועה ממשיכה ברצף בעיט."}, {"tc": "0:32", "general": false, "name": "שוט האריה", "task": "שומרים על סוג השוט: המצלמה הולכת עם האריה ופותחת את נוף הסוואנה. נשלח לך שוט חלופי מהצד להחלטה."}, {"tc": "0:36", "general": false, "name": "כניסת הלוחמים והירידה למטה", "task": "מוסיפים מחסה טבעי: כמה סלעים עם אדמה, שהלוחמים יורדים מאחוריהם. סלע בצד שמאל של הפריים והלוחם השני מאחוריו."}, {"tc": "0:56", "general": false, "name": "הטנק השני (האחורי)", "task": "תנועת הטנק השני נבנית מחדש: נסיעה טבעית וכבדה, מחובר לקרקע."}, {"tc": "1:05", "general": false, "name": "מסך 1:05", "task": "עדכון נתוני הסטריפ התחתון (תאריך, שעה, נ\"צ) והסוללה. המפה והנקודות נשארים."}, {"tc": "1:08", "general": false, "name": "Launch: העיט מתרומם מהענף", "task": "העיט עומד על ענף עבה, בגובה ובפרופורציה נכונים, ומתרומם ממנו מאפס באותה זווית של הרחפן."}, {"tc": "1:08", "general": false, "name": "Launch: חיתוך דאבל אקשן", "task": "החיתוך בין הרחפן לעיט נעשה כדאבל אקשן: שניהם מתרוממים מאפס, והעיט מקבל עוד זמן להתרומם."}, {"tc": "1:17", "general": false, "name": "מסך 1:17 (טאבלט)", "task": "סטריפ, שעה וסוללה. X אדום מהבהב על אייקון ה-GPS. במסך השמאלי מבט מהרחפן, המפה נשארת מימין. כותרת עליונה: Take Off הופך ל-Mission."}, {"tc": "1:17", "general": false, "name": "מבט רחפן מרחף למסך 1:17", "task": "שוט חדש: מבט מהרחפן בריחוף, באותה סביבה, שמוצג על המסך."}, {"tc": "1:19", "general": false, "name": "סדר המוניטור והגליץ'", "task": "לפי האופליין: המוניטור חוזר למקומו, והגליץ' מגיע אחרי המסך עם ה-GPS."}, {"tc": "1:19", "general": false, "name": "שוט הרחפן מהצד (שוט הגליץ')", "task": "שוט הרחפן מהצד, בלי השדות המרובעים, עובר תיקון. הגליץ' מתרחש בתוכו."}, {"tc": "1:22", "general": false, "name": "הכניסה לבולט טיים", "task": "הבולט טיים ממשיך ברצף את השוט הקודם, באותה סביבה ובאותה זווית, עד abort mission."}, {"tc": "1:23", "general": false, "name": "בולט טיים: מבנה לפי המסמך", "task": "לפי המסמך שלך: 1:23 סלואו מושן באותה זווית, קאט לקלוז רוטור, קאט לפתוח, ב-1:29 סיבוב 180 עד סוף military ב-1:31 וחזרה למהירות רגילה. כיתוב ב-1:27."}, {"tc": "1:32", "general": false, "name": "מסך 1:32", "task": "סטריפ, שעה וסוללה. כותרת עליונה: Hover. בסטריפ התחתון אייקון הרכב מוחלף באייקון טנק."}, {"tc": "1:35", "general": false, "name": "מבט העיט על החזירים", "task": "חזירי הבר הולכים ברוגע, בתנועה מקבילה לטנקים, ולא בורחים."}, {"tc": "1:35", "general": false, "name": "קיצור מבט העיט", "task": "מבט העיט נשאר, מקוצר, ומיד אחריו חיתוך לשוט החזירים מלפנים."}, {"tc": "1:36", "general": false, "name": "שוט חדש: החזירים מבחינים בעיט", "task": "שוט חדש מלפנים: שני חזירי הבר הולכים לכיוון המצלמה, מבחינים בעיט ומתחילים לרוץ."}, {"tc": "1:37", "general": false, "name": "מסך 1:37", "task": "סטריפ, שעה וסוללה. על המסך מבט הרחפן על הטנקים בתנועה. הצלב הלבן מגיב ללחיצה ועוקב אחרי הטנק הקדמי. אייקון הטנק נדלק."}, {"tc": "1:41", "general": false, "name": "מסך 1:41", "task": "סטריפ, שעה וסוללה. Hover הופך ל-Homing רק אחרי שהלוחם מרים את האצבע. הטנק מסומן והצלב עליו, באותו מרחק."}, {"tc": "1:46", "general": false, "name": "מעין העיט לצלילה", "task": "חוזרת תנועת המצלמה בין העין לצלילה, לפי המסמך. הצלילה עצמה נבנית מחדש בתנועה טבעית של עיט."}, {"tc": "1:52", "general": false, "name": "החזירים בורחים, העיט מאחוריהם", "task": "שוט החזירים מאחור מוחלף בשוט מלפנים: שניהם רצים לכיוון המצלמה והעיט צולל מאחוריהם."}, {"tc": "2:00", "general": false, "name": "כותרת L-SPIKE 2X", "task": "אנימציית הכותרת נבנית לפי הלוגו של המוצר מספר המותג."}, {"tc": null, "general": false, "name": "L-Spike 2X על הקלוז אפ של הרש\"ק", "task": "כשהקריין אומר L-Spike 2X, התמונה עוברת לקלוז אפ של הרש\"ק במקום הרחפן."}, {"tc": null, "general": false, "name": "הנמר נותן ביס (Instinct)", "task": "על המילה Instinct הנמר נותן ביס לכיוון המצלמה, כמו באופליין."}, {"tc": null, "general": false, "name": "הרכבת הרחפן על הגבעה", "task": "מוסיפים סלעים כמחסה בשוט הרכבת הרחפן, בגובה הראש של הלוחם שמסתכל על הרחפן."}, {"tc": null, "general": false, "name": "קלוז אפ של לוחם", "task": "מוסיפים סלע מאחורי הכתף של הלוחם, כך שייראה מוגן."}, {"tc": null, "general": false, "name": "הרחפן עולה מאזור הלוחמים", "task": "ייצוב השוט, ושימוש בסלע שכבר קיים בו כדי לחבר אותו למקום הלוחמים."}, {"tc": null, "general": false, "name": "תזמון המסך מול built to military standard", "task": "המסך נכנס בדיוק על built to military standard, לפי האופליין."}, {"tc": null, "general": false, "name": "העיט: השוט הראשון שלו", "task": "בפעם הראשונה שרואים את העיט הוא מנפנף בכנפיים לאט ורחב, במלוא תפארתו, ולא רק גולש."}, {"tc": null, "general": true, "name": "העיט לאורך כל הסרט", "task": "העיט מקבל יותר חיים בכל הופעותיו: נשימה, תנועות ראש וכנפיים טבעיות."}, {"tc": null, "general": true, "name": "הלוחמים חשופים לאורך הסרט", "task": "בכל שוטי הלוחמים מוסיפים מחסה טבעי (סלעים, גל אבנים), כדי שייראו מבצעיים ולא חשופים."}, {"tc": null, "general": true, "name": "סלעים שנראים מלאכותיים", "task": "מורידים סלעים שנראים מלאכותיים. אחד כבר הוסר, ואם תזהה עוד, נשמח לדעת."}, {"tc": null, "general": true, "name": "כל המסכים: סטריפ וסוללה", "task": "בכל המסכים: תאריך 25/10/2026, שעה שמתחילה ב-16:09:16 ומתקדמת לפי התרחיש, N34 קבוע ו-E משתנה, סוללה 28:06."}, {"tc": null, "general": true, "name": "כל הכותרות בסרט", "task": "פונט Gotham Bold בגודל מוגדל. אות ראשונה גדולה בכל מילה, מילות קישור קטנות. האנימציה תתחיל אחרי שכל הנוסחים יאושרו."}]};
(function(){
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var rows = DATA.items;
  document.getElementById('cnt').textContent = rows.length;
  document.getElementById('sub').textContent = 'מסודרים לפי סדר הסרט.';
  document.getElementById('tb').innerHTML = rows.map(function(r, i){
    var t = r.tc ? '<span class="tc">' + esc(r.tc) + '</span>' : '<span class="tc none">' + (r.general ? 'כל הסרט' : 'לפי השוט') + '</span>';
    return '<tr><td class="n">' + (i + 1) + '</td><td class="t">' + t + '</td><td class="s">' + esc(r.name) + '</td><td class="w">' + esc(r.task) + '</td></tr>';
  }).join('');
})();
</script>
